name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build "twine<7"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  test:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            spark: "3.5.7"
          - python: "3.11"
            spark: "3.5.7"
          - python: "3.12"
            spark: "4.0.2"
          - python: "3.13"
            spark: "4.0.2"
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pandas,optimization,mlflow,boruta,persistence]" "pyspark==${{ matrix.spark }}"
      - run: python -m pip check
      - run: python -m pip freeze
      - name: Full suite (optional integrations required; no skips)
        run: python -m pytest --fail-on-skip --junitxml=test-results.xml
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Clean wheel round trips
        run: python scripts/check_wheel.py --spark-version "${{ matrix.spark }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}-${{ matrix.spark }}
          path: test-results.xml
