[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmodelkit"
version = "0.2.0"
description = "A toolkit for model development, evaluation, and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Celso Renato Quiroz Valle" },
]
keywords = [
    "credit-risk",
    "data-science",
    "machine-learning",
    "metrics",
    "pandas",
    "pyspark",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0", "scikit-learn>=1.2"]
pyspark = ["pyspark>=3.5", "numpy>=1.23", "scipy>=1.9"]
mlflow = ["mlflow>=2.12"]
persistence = ["joblib>=1.2", "cloudpickle>=2.2"]
secure = ["skops>=0.10"]
onnx = ["skl2onnx>=1.16", "onnx>=1.16", "onnxruntime>=1.17"]
lightgbm = ["lightgbm>=4.0"]
boruta = ["Boruta>=0.4.3"]
dataframes = [
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "pyspark>=3.5",
    "scipy>=1.9",
    "scipy>=1.9",
]
dev = [
    "build>=1.2",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "pyspark>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "twine>=6.0,<7",
]

[project.urls]
Repository = "https://github.com/Celso-RQ-Valle/BrainModelKit"
Documentation = "https://github.com/Celso-RQ-Valle/BrainModelKit/blob/main/docs/feature_selection.md"
Issues = "https://github.com/Celso-RQ-Valle/BrainModelKit/issues"
Changelog = "https://github.com/Celso-RQ-Valle/BrainModelKit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainmodelkit = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=brainmodelkit --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["brainmodelkit"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
