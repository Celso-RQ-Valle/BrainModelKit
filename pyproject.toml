[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmodelkit"
version = "0.1.0"
description = "A toolkit for model development, evaluation, and analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Celso Renato Quiroz Valle" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
pyspark = ["pyspark>=3.5"]
dataframes = [
    "pandas>=2.0",
    "pyspark>=3.5",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/Celso-RQ-Valle/BrainModelKit"
Issues = "https://github.com/Celso-RQ-Valle/BrainModelKit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainmodelkit = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
